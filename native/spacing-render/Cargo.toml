[package]
name = "spacing-render"
description = "Desenho do Spacing com wgpu (Vulkan no Android, Vulkan/DX12 no computador): blocos, modelos do Blender, céu"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
spacing-core = { path = "../spacing-core" }
wgpu = { workspace = true }
bytemuck = { workspace = true }
glam = { workspace = true }
gltf = { workspace = true }
log = { workspace = true }
half = { version = "2", features = ["bytemuck"] }
egui = { workspace = true }
egui-wgpu = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
wgpu = { workspace = true, features = ["vulkan", "gles"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { workspace = true, features = ["dx12", "vulkan"] }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { workspace = true, features = ["vulkan", "gles"] }
