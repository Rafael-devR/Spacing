[package]
name = "spacing-app"
description = "O jogo Spacing nativo: laço, controles de toque e teclado, HUD; Android (NativeActivity) e computador"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "spacing"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "spacing"
path = "src/main.rs"

[dependencies]
spacing-core = { path = "../spacing-core" }
spacing-render = { path = "../spacing-render" }
wgpu = { workspace = true }
winit = { workspace = true }
egui = { workspace = true }
glam = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }
pollster = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
winit = { workspace = true, features = ["android-native-activity"] }
android_logger = "0.15"

[target.'cfg(not(target_os = "android"))'.dependencies]
winit = { workspace = true, features = ["x11", "wayland", "wayland-dlopen"] }
env_logger = { version = "0.11", default-features = false }
png = "0.17"
