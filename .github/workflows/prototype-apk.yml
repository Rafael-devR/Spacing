# Gera o APK do protótipo nativo (Rust + wgpu, docs/design/NATIVO.md). Roda quando o protótipo muda e na mão (Actions →
# "Teste nativo (protótipo)" → Run workflow). O APK fica em Artifacts, como "spacing-teste-nativo". Não é o jogo: é a régua
# de comparação de desempenho com a versão do navegador.
name: Teste nativo (protótipo)

on:
  workflow_dispatch:
  push:
    paths:
      - 'prototypes/nativo/src/**'
      - 'prototypes/nativo/android/**'
      - 'prototypes/nativo/Cargo.toml'
      - 'prototypes/nativo/Cargo.lock'
      - 'prototypes/nativo/build-android.sh'
      - '.github/workflows/prototype-apk.yml'

concurrency:
  group: proto-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: prototypes/nativo
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # o Android SDK e o NDK já vêm no servidor do GitHub; só garante as licenças
      - name: Licenças do Android SDK
        run: |
          SDKM=$(ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)
          if [ -n "$SDKM" ]; then yes | "$SDKM" --licenses > /dev/null || true; fi
      - name: Rust para Android
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar o APK
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          ./build-android.sh -PbenchVersionCode=${{ github.run_number }}
          cp android/app/build/outputs/apk/debug/app-debug.apk "../../spacing-teste-nativo-${GITHUB_SHA::7}.apk"
          echo "APK=spacing-teste-nativo-${GITHUB_SHA::7}.apk" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: spacing-teste-nativo
          path: ${{ env.APK }}
          retention-days: 30
