# Spacing nativo em Rust (docs/design/PORTE_RUST.md): testes do núcleo (paridade com o TS) e o APK de teste. Roda quando o
# código nativo muda e na mão (Actions → "Spacing nativo (Rust)" → Run workflow). O APK fica em Artifacts, como
# "spacing-nativo".
name: Spacing nativo (Rust)

on:
  workflow_dispatch:
  push:
    paths:
      - 'native/**'
      - 'src/assets/models/astronaut.glb'
      - 'src/assets/models/lander.glb'
      - '.github/workflows/native-apk.yml'

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Testes do núcleo (paridade com o TypeScript)
        run: cargo test -p spacing-core --release
      - name: Testes do desenho e do app
        run: cargo test -p spacing-render -p spacing-app --release

  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # o Android SDK e o NDK já vêm no servidor do GitHub; só garante as licenças
      - name: Licenças do Android SDK
        run: |
          SDKM=$(ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)
          if [ -n "$SDKM" ]; then yes | "$SDKM" --licenses > /dev/null || true; fi
      - name: Rust para Android
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          key: android
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar o APK
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          ./build-android.sh -PspacingVersionCode=${{ github.run_number }}
          cp android/app/build/outputs/apk/debug/app-debug.apk "../spacing-nativo-${GITHUB_SHA::7}.apk"
          echo "APK=spacing-nativo-${GITHUB_SHA::7}.apk" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: spacing-nativo
          path: ${{ env.APK }}
          retention-days: 30
