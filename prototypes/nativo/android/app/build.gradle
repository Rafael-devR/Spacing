plugins {
    id 'com.android.application'
}

android {
    namespace = 'app.spacing.bench'
    compileSdk = 36
    defaultConfig {
        applicationId 'app.spacing.bench'
        minSdk 26
        targetSdk 36
        versionCode((project.findProperty('benchVersionCode') ?: '1').toInteger())
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a' }
    }
    // mesma chave de teste do app do jogo (só teste; ver docs/design/APK.md)
    signingConfigs {
        debug {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        // o Rust já vem compilado em modo otimizado (cargo ndk --release); o APK "debug" só quer dizer assinado com a chave de teste
        debug { debuggable false }
    }
    // a biblioteca entra de app/src/main/jniLibs/arm64-v8a/ (gerada pelo cargo ndk, fora do git)
}
